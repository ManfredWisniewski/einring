# Archives finished tasks (- [x] / [-]) from +team/+tasks/<persona>.md into
# +team/+tasks/<persona>.history.md, daily at 02:00 UTC. Runs on `wip` (the
# integrated agent state); the commit goes back to `wip`, which triggers
# the wip-to-work workflow. Convention: +wit/common/conventions/tasks.md
name: tasks-archive

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure wip and work exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          base=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha 2>/dev/null || true)
          [ -z "$base" ] && { echo "no main - cannot bootstrap"; exit 0; }
          for b in wip work; do
            if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$b" --jq .ref >/dev/null 2>&1; then
              gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/heads/$b" -f "sha=$base" >/dev/null
              echo "bootstrapped $b from main"
            fi
          done

      - uses: actions/checkout@v4
        with:
          ref: wip
          submodules: true
          sparse-checkout: |
            +team/+tasks
            +wit/agents/skills
            scripts
            .agents/skills
            skills-lock.json
      - name: Checkout trusted scripts from main
        uses: actions/checkout@v4
        with:
          ref: main
          path: _trusted
          sparse-checkout: |
            scripts
      - name: Sync agent skills
        run: |
          if [ -d "+wit/agents/skills" ]; then
            bash scripts/sync-agent-skills.sh sync
          fi
      - name: Archive done tasks (script from main, not wip)
        run: python3 _trusted/scripts/archive-done-tasks.py
      - name: Commit and push to wip
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '+team/+tasks/' 2>/dev/null || true
          git add '.agents/skills/' 2>/dev/null || true
          git add 'skills-lock.json' 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "chore: archive done tasks and sync agent skills"
          git push origin HEAD:wip
