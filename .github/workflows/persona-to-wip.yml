# Fast-forwards wip to a persona branch on every persona push (WIT branch
# model, see +wit/common/conventions/repo-setup.md). ff-only: if the persona
# branch does not contain wip (was not synced), the run skips - the local
# integrate step (scripts\integrate-wip.ps1) remains the fallback.
# Every workflow run recreates missing wip/work from main — the chain is
# self-healing.
name: persona-to-wip

on:
  push:
    branches-ignore: [main, work, wip]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure wip and work exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          base=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha 2>/dev/null || true)
          [ -z "$base" ] && { echo "no main - cannot bootstrap"; exit 0; }
          for b in wip work; do
            if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$b" --jq .ref >/dev/null 2>&1; then
              gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/heads/$b" -f "sha=$base" >/dev/null
              echo "bootstrapped $b from main"
            fi
          done

      - name: Fast-forward wip to persona branch
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout wip
          if git merge-base --is-ancestor wip "origin/$REF_NAME"; then
            git merge --ff-only "origin/$REF_NAME"
            git push origin wip
          else
            echo "::warning::$REF_NAME does not contain wip - sync locally (sync-persona-branch) then push again"
          fi
