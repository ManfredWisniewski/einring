# Creates the coming week's daily logs in +team/+coordination/, Sunday at
# 03:00 UTC — one file per day, Monday through Sunday, named
# `<YYYY-MM-DD>-<repo>-Daily.md` from +wit/common/templates/coordination/YYYY-MM-DD-REPO-Daily.md.
# Existing files are never overwritten; {{placeholders}} stay untouched except
# the date. Repos without +team/+coordination/ skip silently. Runs on `main`
# and commits back to `main` — these are human-facing artifacts, not agent
# state. Convention: +wit/common/conventions/coordination.md
name: weekly-dailies

on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare-dailies:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure wip and work exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          base=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha 2>/dev/null || true)
          [ -z "$base" ] && { echo "no main - cannot bootstrap"; exit 0; }
          for b in wip work; do
            if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$b" --jq .ref >/dev/null 2>&1; then
              gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/heads/$b" -f "sha=$base" >/dev/null
              echo "bootstrapped $b from main"
            fi
          done

      - uses: actions/checkout@v4
        with:
          ref: main
          submodules: true
      - name: Create daily files for next week
        run: |
          set -e
          COORD="+wit/+team/+coordination"
          SLUG=$(basename "$(git rev-parse --show-toplevel)")
          TPL="+wit/common/templates/coordination/YYYY-MM-DD-REPO-Daily.md"
          if [ ! -d "$COORD" ]; then
            echo "no $COORD — nothing to do"
            exit 0
          fi
          if [ ! -f "$TPL" ]; then
            echo "template $TPL missing — nothing to do"
            exit 0
          fi
          # Monday after the Sunday run through the following Sunday
          for i in 1 2 3 4 5 6 7; do
            d=$(date -d "next monday + $((i - 1)) days" +%F)
            f="$COORD/$d-$SLUG-Daily.md"
            if [ -f "$f" ]; then
              echo "exists: $f"
            else
              sed "s/{{YYYY-MM-DD}}/$d/g" "$TPL" > "$f"
              echo "created: $f"
            fi
          done
      - name: Commit and push to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '+wit/+team/' 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "chore: create daily logs for next week"
          git push origin HEAD:main
