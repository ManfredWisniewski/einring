name: Open PR work to main

on:
  schedule:
    # 07:00, 09:00, 11:00, 13:00, 15:00, 17:00 Europe/Berlin (CEST = UTC+2)
    # during CET (winter, UTC+1) this fires one hour earlier
    - cron: '0 5,7,9,11,13,15 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  open-pr:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Create PR if work is ahead of main
        run: |
          git fetch origin main:refs/remotes/origin/main work:refs/remotes/origin/work

          ahead=$(git rev-list --count origin/main..origin/work)
          if [ "$ahead" -eq 0 ]; then
            echo "work is not ahead of main — nothing to do."
            exit 0
          fi

          open=$(gh pr list --state open --base main --head work --json number --jq 'length')
          if [ "$open" -gt 0 ]; then
            echo "An open work → main PR already exists."
            exit 0
          fi

          gh pr create --base main --head work \
            --title "Merge work into main ($(date -u +'%Y-%m-%d %H:%M UTC'))" \
            --body "Scheduled merge of \`work\` ($ahead commits ahead) into \`main\`."
