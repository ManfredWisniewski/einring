name: build-image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  IMAGE_REPOSITORY: ghcr.io/manfredwisniewski/einring

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # +wit is in .dockerignore; its ssh:// remote is unreachable from CI anyway.
          submodules: false
      - name: Fetch biti submodule
        env:
          BITI_PAT: ${{ secrets.BITI_PAT }}
        run: |
          test -n "$BITI_PAT" || { echo "::error::BITI_PAT secret missing — needs contents:read on ManfredWisniewski/biti"; exit 1; }
          git config --global url."https://x-access-token:${BITI_PAT}@github.com/".insteadOf "https://github.com/"
          git -c http.https://github.com/.extraheader= submodule update --init biti

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # OCI labels carry the app + per-module versions (D69 manifests) so a
      # deployment can inspect an image and decide whether any enabled module
      # actually changed — without pulling or running it.
      - name: Resolve version labels
        id: vers
        run: |
          app=$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' apps/app/package.json | head -1)
          declare -A mods
          for f in apps/bff/src/modules/*.ts; do
            case "$f" in *.test.ts) continue ;; esac
            v=$(sed -n 's/^  version: *"\([^"]*\)".*/\1/p' "$f" | head -1)
            [ -n "$v" ] && mods[$(basename "$f" .ts)]=$v
          done
          for f in apps/app/src/modules/*/index.ts; do
            [ -f "$f" ] || continue
            v=$(sed -n 's/^  version: *"\([^"]*\)".*/\1/p' "$f" | head -1)
            id=$(basename "$(dirname "$f")")
            [ -n "$v" ] && mods[$id]=${mods[$id]:-$v}
          done
          body=$(printf '%s\n' "${!mods[@]}" | sort | while read -r id; do
            printf '"%s":"%s",' "$id" "${mods[$id]}"
          done)
          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "modules={${body%,}}" >> "$GITHUB_OUTPUT"

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE_REPOSITORY }}
          tags: |
            type=sha
            type=ref,event=tag
            type=raw,value=latest
          labels: |
            org.einring.app.version=${{ steps.vers.outputs.app }}
            org.einring.modules=${{ steps.vers.outputs.modules }}

      # Single-arch build loaded into the runner for the smoke test; the push
      # build below reuses this buildx cache.
      - uses: docker/build-push-action@v6
        id: smoke
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: einring:smoke
          build-args: |
            VITE_AUTHENTIK_ISSUER=${{ vars.VITE_AUTHENTIK_ISSUER }}
            VITE_AUTHENTIK_CLIENT_ID=${{ vars.VITE_AUTHENTIK_CLIENT_ID }}

      - name: Healthcheck
        run: |
          set -e
          docker run -d --name einring-smoke -p 3000:3000 \
            -e AUTHENTIK_ISSUER="${{ vars.VITE_AUTHENTIK_ISSUER }}" \
            -e AUTHENTIK_CLIENT_ID="${{ vars.VITE_AUTHENTIK_CLIENT_ID }}" \
            -e MODULES="wiki" \
            -e NEXTCLOUD_URL="https://nextcloud.invalid" \
            -e ENCRYPTION_KEY="$(openssl rand -base64 32)" \
            -e PUBLIC_URL="http://localhost:3000" \
            einring:smoke
          # Startup does OIDC discovery against the real issuer, then serves /healthz.
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/healthz; then break; fi
            if [ "$i" -eq 30 ]; then
              echo "healthz never became ready"; docker logs einring-smoke; exit 1
            fi
            sleep 2
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/me)" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/)" = "200"
          docker rm -f einring-smoke

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Public OIDC config baked into the web bundle — GitHub Actions variables,
          # not secrets. Define them under repo Settings > Secrets and variables > Actions > Variables.
          build-args: |
            VITE_AUTHENTIK_ISSUER=${{ vars.VITE_AUTHENTIK_ISSUER }}
            VITE_AUTHENTIK_CLIENT_ID=${{ vars.VITE_AUTHENTIK_CLIENT_ID }}
