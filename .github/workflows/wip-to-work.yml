# Integrates wip into work on every push to wip (WIT branch model, see
# +wit-common/conventions/repo-setup.md). On conflict the run fails, work
# stays unchanged, and a pull request is opened for a human to resolve.
name: wip-to-work

on:
  push:
    branches: [wip]

permissions:
  contents: write
  pull-requests: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure wip and work exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          base=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha 2>/dev/null || true)
          [ -z "$base" ] && { echo "no main - cannot bootstrap"; exit 0; }
          for b in wip work; do
            if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$b" --jq .ref >/dev/null 2>&1; then
              gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/heads/$b" -f "sha=$base" >/dev/null
              echo "bootstrapped $b from main"
            fi
          done

      - uses: actions/checkout@v4
        with:
          ref: work
          fetch-depth: 0

      - name: Merge wip into work
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-edit origin/wip

      - name: Push work
        run: git push origin work

      - name: Open pull request for manual resolution on conflict
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create --base work --head wip \
            --title "wip → work (merge conflict)" \
            --body "Automatic merge of wip into work failed. Resolve the conflicts in this PR, then merge it — work is unchanged until then." \
            || true
